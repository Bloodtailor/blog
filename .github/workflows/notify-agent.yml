# On a new post, email it to the OpenClaw agent. The agent decides whether to post it
# anywhere, where, in what words, and whether to check with Aaron first — this workflow
# publishes nothing to any social account.
#
# Can also be run by hand ("Run workflow") to catch up anything a failed run missed.
# A manual run sends every post not already recorded in .syndicated.json, or just one
# if you give it a slug.
name: Hand new posts to the agent

on:
  push:
    branches: [main]
    paths:
      - "src/content/posts/**"
  workflow_dispatch:
    inputs:
      only:
        description: "Slug to send on its own (blank = every outstanding post)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. At depth 2 the push's "before" commit is missing whenever a
          # push carries more than one commit, the diff throws, and the run reports
          # success having sent nothing.
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Email the new post to the agent
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # github.event.inputs, not inputs: the `inputs` context does not exist for a
          # push event, and referencing it invalidates the whole definition — which is
          # why GitHub kept serving an older parse and never registered the manual
          # trigger. This form resolves to empty on push.
          #
          # It also goes through env rather than being interpolated straight into the
          # shell, so a slug can't break out of the command.
          ONLY: ${{ github.event.inputs.only }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          if [ -n "$ONLY" ]; then
            npm run notify-agent -- --only "$ONLY"
          else
            npm run notify-agent
          fi

      - name: Commit hand-off state
        run: |
          git config user.name "notify-bot"
          git config user.email "actions@github.com"
          git add .syndicated.json
          git diff --staged --quiet || git commit -m "chore: record agent hand-off [skip ci]"
          git push
