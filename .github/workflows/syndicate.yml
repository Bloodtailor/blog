name: Syndicate new posts

on:
  push:
    branches: [main]
    paths:
      - "src/content/posts/**"

permissions:
  contents: write

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run syndication
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run syndicate

      - name: Commit syndication state
        run: |
          git config user.name "syndication-bot"
          git config user.email "actions@github.com"
          git add .syndicated.json
          git diff --staged --quiet || git commit -m "chore: update syndication state [skip ci]"
          git push
