  /* SPEC §10 / D15: near-black FunOrb-style starfield void behind a fixed
     640x480 logical canvas, integer-scaled up and letterboxed. The stars are
     CSS gradients, not an image — no external request, no asset to ship. */
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #05070d;
    color: #d9d2bd;
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }
  body {
    background-image:
      radial-gradient(1px 1px at 12% 22%, #cfd8ee 50%, transparent 51%),
      radial-gradient(1px 1px at 74% 14%, #9fb0d6 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 71%, #e6ecf9 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 63%, #8fa2c8 50%, transparent 51%),
      radial-gradient(1px 1px at 57% 41%, #b9c6e2 50%, transparent 51%),
      radial-gradient(1px 1px at 21% 88%, #7c8db1 50%, transparent 51%),
      radial-gradient(1200px 700px at 50% 45%, #101728 0%, #05070d 70%);
    background-repeat: repeat;
    background-size: 320px 320px, 260px 260px, 410px 410px, 350px 350px, 290px 290px, 470px 470px, 100% 100%;
  }
  /* Column flow, not an overlay: the IP notice is a SIBLING of the frame, so
     it can never paint on top of the canvas. That matters beyond taste — the
     gauntlet screenshots the <canvas> element, and anything the page paints
     over it lands in the capture. */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  /* The gold double border the original drew around its applet. The canvas
     backing store stays 640x480; build/app code only ever changes the CSS box. */
  #frame {
    padding: 4px;
    background: linear-gradient(180deg, #d8b45c 0%, #8d6a1f 50%, #d8b45c 100%);
    border: 2px solid #3a2d0d;
    box-shadow: 0 0 0 2px #d8b45c, 0 8px 40px rgba(0, 0, 0, 0.75);
    line-height: 0;
  }
  #board {
    display: block;
    background: #0d1017;
    border: 2px solid #2a2313;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* Editor panel host. Hidden by default; the editor shell adds .open.
     Overlays the stage so the 640x480 frame is never resized by it. */
  #editor-panel {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(460px, 100vw);
    overflow: auto;
    padding: 12px 14px;
    box-sizing: border-box;
    background: #0b0f18;
    border-left: 2px solid #8d6a1f;
    color: #d9d2bd;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
  }
  #editor-panel.open { display: block; }

  /* Editor tool chrome. Tools build their own markup inside #editor-panel and
     tag it with `data-ed` hooks (the harness's grip on the real UI); the
     look is shared here so every tool arrives consistent without importing a
     stylesheet of its own. */
  .ed-tool { margin: 0 0 18px; }
  .ed-title {
    margin: 0 0 6px;
    font-family: Cinzel, Georgia, "Times New Roman", serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #d8b45c;
  }
  .ed-subject { margin: 0 0 10px; color: #8d9bb0; font-size: 12px; }
  .ed-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .ed-label {
    display: block;
    font-family: Cinzel, Georgia, serif;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: #b9a978;
    margin-bottom: 4px;
  }
  .ed-row .ed-label { margin-bottom: 0; min-width: 92px; }
  .ed-input {
    flex: 1;
    min-width: 0;
    padding: 5px 7px;
    background: #050810;
    color: #e8dcb5;
    border: 1px solid #4c4432;
    border-radius: 2px;
    font: inherit;
  }
  .ed-input:focus { outline: 1px solid #d8b45c; }
  .ed-help { margin: 0 0 10px; color: #7f8ba0; font-size: 11px; line-height: 1.4; }
  .ed-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .ed-button {
    padding: 5px 10px;
    background: linear-gradient(180deg, #2a2f3d 0%, #171b26 100%);
    color: #e8dcb5;
    border: 1px solid #6b5a2c;
    border-radius: 2px;
    font-family: Cinzel, Georgia, serif;
    font-size: 12px;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  .ed-button:hover { border-color: #d8b45c; color: #fff3d0; }
  .ed-button:active { background: #12151d; }
  .ed-bundle {
    display: block;
    width: 100%;
    box-sizing: border-box;
    min-height: 92px;
    padding: 6px 7px;
    background: #050810;
    color: #9fb0c8;
    border: 1px solid #2a3141;
    border-radius: 2px;
    font-family: "Courier New", monospace;
    font-size: 11px;
    resize: vertical;
  }
  .ed-errors {
    margin-top: 8px;
    min-height: 16px;
    color: #e07a6a;
    font-size: 11px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  #ip-notice {
    margin: 0;
    padding: 0 8px;
    max-width: 100vw;
    text-align: center;
    font-family: system-ui, sans-serif;
    font-size: 11px;
    color: #6f7c93;
    pointer-events: none;
  }
</style>
</head>

</div>

"ability.mind-control","type":"ability","schemaVersion":1,"name":"Invade the Mind","effect":"mind-control","params":{"radius":1,"permanent":true,"consumesAction":true},"description":"Spends this unit's action to take permanent control of one adjacent enemy. A named campaign unit taken this way loses its name and its leader status.","active":true,"icon":null},"abilities/mountain-smash.json":{"id":"ability.mountain-smash","type":"ability","schemaVersion":1,"name":"Smash","effect":"mountain-smash","params":{"from":"terrain.mountain","to":"terrain.open"},"description":"Moving one tile onto a mountain flattens it into open ground. An Ourg can open a pass through a range no other ground unit could cross.","active":false,"icon":null},"abilities/open-portal.json":{"id":"ability.open-portal","type":"ability","schemaVersion":1,"name":"Open Portal","effect":"open-portal","params":{"radius":1,"consumesSelf":true,"structure":"structure.portal","singleGod":true,"requiresFlatTile":true},"description":"Consumes this unit entirely to open a new portal on a chosen adjacent flat tile. The new portal summons the units of one god only, chosen when it is opened.","active":true,"icon":null},"abilities/raise-dead.json":{"id":"ability.raise-dead","type":"ability","schemaVersion":1,"name":"Raise Dead","effect":"raise-dead","params":{"radius":1,"spawns":"unit.skeleton","healsAdjacentUndead":true},"description":"Adjacent bone piles rise as skeletons under this unit's owner at the start of the next turn, and every adjacent skeleton is healed to full. Raised skeletons may stand on tiles they could never have walked onto, and a re-raised skeleton loses any veterancy it had earned.","active":false,"icon":null},"abilities/self-sacrifice-control.json":{"id":"ability.self-sacrifice-control","type":"ability","schemaVersion":1,"name":"Parasite","effect":"self-sacrifice-control","params":{"radius":1,"permanent":true,"consumesSelf":true,"targetStrengthAtMostAttacker":true},"description":"Attack an enemy whose current strength is no greater than this unit's own: the attacker dies and the target changes sides permanently. A named campaign unit taken this way loses its name and its leader status.","active":true,"icon":null},"abilities/slow-aura.json":{"id":"ability.slow-aura","type":"ability","schemaVersion":1,"name":"Inhibiting Swarm","effect":"slow-aura","params":{"radius":2,"multiplier":0.33},"description":"Insects boil around this unit. Enemy movement within 2 tiles is multiplied by one third, so crossing the swarm costs three times as much as crossing open ground.","active":false,"icon":null},"abilities/smoke-aura.json":{"id":"ability.smoke-aura","type":"ability","schemaVersion":1,"name":"Smoke Cloud","effect":"smoke-aura","params":{"radius":2,"blocksRanged":true},"description":"A greasy cloud fills 2 tiles in every direction. No ranged or magical attack may be made into, out of, or entirely within the cloud; melee is unaffected.","active":false,"icon":null},"abilities/spread.json":{"id":"ability.spread","type":"ability","schemaVersion":1,"name":"Spread","effect":"spread","params":{"radius":1,"splitDivisor":2,"minStrength":1,"manaPerTurn":10,"spawns":"unit.jade-vine","targetTerrain":"terrain.open"},"description":"Grows a new vine onto an adjacent open tile. Parent and child are both set to half the parent's strength, rounded down, never below 1. Every vine tile costs its owner 10 mana per turn; a vine that cannot be paid for withers. Killing a vine grants no veterancy.","active":true,"icon":null},"abilities/strength-aura.json":{"id":"ability.strength-aura","type":"ability","schemaVersion":1,"name":"Gift of the Grove","effect":"strength-aura","params":{"radius":1,"amount":5,"decayPerTurn":1,"curesPoison":true},"description":"Friendly units adjacent to this one fight at +5 strength and are cured of poison. The bonus is not permanent: once a unit leaves the aura it bleeds away at 1 per turn.","active":false,"icon":null},"abilities/teleport-strike.json":{"id":"ability.teleport-strike","type":"ability","schemaVersion":1,"name":"Shift","effect":"teleport-strike","params":{"usesUnitRange":true,"killsTarget":true,"consumesAction":true},"description":"Steps out of the light onto a tile an enemy already occupies, killing it outright and taking its place. It costs this unit its action for the turn.","active":true,"icon":null},"abilities/terrain-burn.json":{"id":"ability.terrain-burn","type":"ability","schemaVersion":1,"name":"Scorch","effect":"terrain-burn","params":{"from":"terrain.forest","to":"terrain.open"},"description":"Moving one tile onto forest burns it away, leaving open ground behind.","active":false,"icon":null},"abilities/terrain-flood.json":{"id":"ability.terrain-flood","type":"ability","schemaVersion":1,"name":"Flood","effect":"terrain-flood","params":{"from":"terrain.open","to":"terrain.river","requiresLeavingWater":true},"description":"Moving from river or sea onto open ground floods the tile it steps onto, turning it to river. The Elemental can lay its own road across a continent.","active":false,"icon":null},"abilities/terrain-plant.json":{"id":"ability.terrain-plant","type":"ability","schemaVersion":1,"name":"Take Root","effect":"terrain-plant","params":{"from":"terrain.open","to":"terrain.forest"},"description":"Moving one tile onto open ground plants new forest there. An Ent leaves woodland in its wake, and its own faction moves through that woodland at full speed.","active":false,"icon":null},"ai/guard.json":{"id":"ai.guard","type":"ai","schemaVersion":1,"name":"Guard","params":{"aggression":0.7,"expansionWeight":0,"riskAversion":0.1,"targetPriority":["nearest","capturer","leader"],"guardMode":true,"guardRadius":3,"summonReserve":0,"minCapturers":0,"harassWeight":0,"lookaheadTurns":0},"description":"The campaign garrison behaviour: hold position until an enemy comes within guardRadius or the unit is attacked, then fight as normal but never leave the post. Used by the Draynor Hill guards, the Elemental at Port Sarim, the Peddewa fortress and the guard lions in Shock and Awe."},"ai/standard.json":{"id":"ai.standard","type":"ai","schemaVersion":1,"name":"Standard","params":{"aggression":0.5,"expansionWeight":1.2,"riskAversion":0.4,"targetPriority":["leader","capturer","helper","ranged","mage","nearest"],"summonReserve":0,"minCapturers":1,"harassWeight":0.5,"lookaheadTurns":1,"tieEpsilon":4,"frontierPatience":2,"captureCandidates":3},"description":"The baseline opponent (SPEC §9): survive check, then the summon ladder at the favour frontier, then capture, then fight, then harass. [LOAD-BEARING] it must break ties among equally-valued candidate actions with the seeded match RNG — combat resolution is deterministic, so tie-breaking is the only way the seed can change play, and without it all 30 self-play seeds replay one identical game. tieEpsilon is the width of that tie band in score points: every candidate within it of the best is drawn from uniformly using the match RNG cursor. frontierPatience is how many turns of income the AI will hold mana for to afford the next favour-raising summon; captureCandidates is how many structures each capturer weighs before choosing."},"campaigns/guthix-awakens.json":{"id":"campaign.guthix-awakens","type":"campaign","schemaVersion":1,"name":"Guthix Awakens","description":"Twenty-two missions across the land that becomes the Wilderness, ending the God Wars and banishing the gods. Guthixian forces fight every other faction in turn, including a five-way battle royale at God Wars and a boss rush against the Interlopers at End of an Age. Like Saradomin Strikes, several nodes open from more than one predecessor rather than by strict adjacency.","faction":"faction.guthix","missions":[{"key":"pack-mentality","name":"Pack Mentality","difficulty":1,"scenario":null,"x":251,"y":398,"unlocks":["the-beautiful-north"],"reward":{"kind":"unit","ref":"unit.wolf"}},{"key":"the-beautiful-north","name":"The Beautiful North","difficulty":1,"scenario":null,"x":264, t almost nothing, then follows them with ogres, a Cyclops whose stare freezes an entire flank, and an Ourg that walks straight through a mountain range. Bandosian armies win by being everywhere at once and caring very little about casualties.","playable":true,"unlock":{"runes":50}},"factions/guthix.json":{"id":"faction.guthix","type":"faction","schemaVersion":1,"name":"Guthix","color":"#4E8C34","icon":"icon.faction-guthix","description":"Balance fights on ground of its own choosing. Guthixian units cross forest at full speed and take a heavier defensive bonus there than anyone else, which turns woodland from an obstacle into a fortress. The roster is broad rather than sharp — dwarves, druids, siege cannon, gnome aircraft, and an Ent that plants new forest wherever it walks.","playable":true,"unlock":null,"terrainAffinity":{"terrain.forest":{"moveMultiplier":1,"defenceBonus":0.3}}},"factions/menaphite.json":{"id":"faction.menaphite","type":"faction","schemaVersion":1,"name":"Menaphite Pantheon","color":"#D8B45C","icon":"icon.faction-menaphite","description":"The desert pantheon brings poison, misdirection and water. Locusts, mummies and beetle-priests leave wounds that go on working; a Sphinx simply asks an enemy to change sides; and the Elemental of Elidinis carves new rivers across dry ground as it moves. Menaphite armies grind an opponent down between battles rather than during them.","playable":true,"unlock":{"runes":50}},"factions/neutral.json":{"id":"faction.neutral","type":"faction","schemaVersion":1,"name":"Neutral","color":"#9A9088","icon":"icon.faction-neutral","description":"The unaligned pool every commander may draw on, whichever gods they took into the game. Barbarians are the only cheap way to take a building, the Portal Mage buys you a second front, and at the top of the ladder sits the King Black Dragon — the strongest thing on any board, and available to exactly one player per match. Neutral units unlock against whichever god you already hold the most favour with.","playable":true,"unlock":null},"factions/saradomin.json":{"id":"faction.saradomin","type":"faction","schemaVersion":1,"name":"Saradomin","color":"#4C86D8","icon":"icon.faction-saradomin","description":"The Lord of Order fields disciplined, expensive, well-drilled armies: plate-armoured knights, temple lions, and healers who keep them all standing. Saradomin wins by attrition — Monks and Priests turn a battered line back into a fresh one, and an Icyene overhead makes a ranged army very hard to approach. His forces are slow to assemble and unforgiving of impatience.","playable":true,"unlock":null},"factions/seren.json":{"id":"faction.seren","type":"faction","schemaVersion":1,"name":"Seren","color":"#7ED0D8","icon":"icon.faction-seren","description":"The elves fight fast and precisely. Serenist forces are built from long-ranged archers, crystal-armoured nobles and skirmishers that outrun any answer, with an Elf Songstress who teaches the whole host to fight every enemy class equally well. Nothing here is cheap, and nothing here is meant to stand and trade blows.","playable":true,"unlock":{"runes":50}},"factions/zamorak.json":{"id":"faction.zamorak","type":"faction","schemaVersion":1,"name":"Zamorak","color":"#C42B2B","icon":"icon.faction-zamorak","description":"Chaos takes the cheap and the disposable and makes a virtue of both. Zamorak raises skeletons that fall apart on their own, werewolves that arrive before you are ready, and demons that end a fight outright. Necromancers turn the battlefield dead into the next wave, so a Zamorakian army is often at its most dangerous immediately after a defeat.","playable":true,"unlock":null},"factions/zaros.json":{"id":"faction.zaros","type":"faction","schemaVersion":1,"name":"Zaros","color":"#6A3CA8","icon":"icon.faction-zaros","description":"The Empty Lord's legions survive only in the campaigns. Zarosian forces appear as scripted enemies at Senntisten, at Peddewa and in the Zaros Temple, fielding renamed rangers and magi alongside borrowed Zamorakian troops. No player may summon a follower of Zaros; the faction exists so that those missions have a banner to fly.","playable":false,"unlock":null},"generators/epic-default.json":{"id":"generator.epic-default","type":"generator","schemaVersion":1,"name":"Epic (default)","params":{"size":60,"playerRange":[4,8],"terrainWeights":{"o":55,"t":8,"b":2,"x":0,"s":6,"r":5,"e":4,"f":14,"m":6,"w":0},"structureBudget":{"village":24,"tower":8,"portalPerPlayer":1},"symmetry":"rotational","theme":"theme.misthalin","smoothingPasses":3,"minStartSeparation":20},"description":"Epic maps are the only randomly generated size in the original (60x60, 4-8 players, 40 turns). Weights are per terrain character and are relative, not percentages; bridge tiles are placed by the river pass rather than scattered, and exit/wall are campaign-only so they weight zero. Rotational symmetry is what keeps a 4-8 player free-for-all fair."},"maps/frozen-small-1.json":{"id":"map.frozen-small-1","type":"map","schemaVersion":1,"name":"Gelid Reach","theme":"theme.frozen-wastes","width":20,"height":20,"terrain":["mmmoooooooooooooooee","mooooooommmooooooeee","ooooooooommmofffrrre","ooottoooooooofofrroo","ooootttttttttttroooo","ooootooooooffobooooo","ooootfffmmsorrttffoo","ooootfffomorrrstffoo","omootoffooorrootmooo","ommotomossrommotomoo","oomotommorssomotommo","ooomtoorroooffotoomo","oofftsrrromoffftoooo","ooffttrrosmmffftoooo","oooooboffooooootoooo","oooortttttttttttoooo","oorrfofoooooooottooo","errrfffommmooooooooo","eeeoooooommmooooooom","eeooooooooooooooommm"],"structures":[{"structure":"structure.village","x":6,"y":2,"owner":0},{"structure":"structure.village","x":12,"y":2,"owner":null},{"structure":"structure.portal","x":3,"y":3,"owner":0},{"structure":"structure.tower","x":13,"y":5,"owner":null},{"structure":"structure.village","x":2,"y":6,"owner":0},{"structure":"structure.village","x":8,"y":8,"owner":null},{"structure":"structure.village","x":17,"y":8,"owner": slot":1,"faction":"faction.saradomin","control":"ai","gods":["faction.saradomin"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":15,"y":3}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":"ai.standard","color":"#8C4CD8"}],"objectives":[{"type":"eliminate"}],"triggers":[],"reward":null},"scenarios/skirmish-frozen-small-1.json":{"id":"scenario.skirmish-frozen-small-1","type":"scenario","schemaVersion":1,"name":"Skirmish: Gelid Reach","campaign":null,"map":"map.frozen-small-1","briefing":"Open snowfield from edge to edge, and a frozen river cutting the whole of it corner to corner. There are exactly two bridges on that ice and a tower watching each of them; everything else must ford, and only your barbarians can. The road out of your portal runs north and east along the rim to the far crossing - fast, and in plain sight the whole way. The evergreen stands are the only thing on this board that will hide a bowman, and Zamorak's road is the mirror of yours.","objectiveText":"Take every enemy portal and destroy every enemy unit. A commander with no portal and no units left is out; the last commander standing wins. If the turn limit runs out first, the most victory points wins.","players":[{"slot":0,"faction":"faction.saradomin","control":"human","gods":["faction.saradomin"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":3,"y":3}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":null},{"slot":1,"faction":"faction.zamorak","control":"ai","gods":["faction.zamorak"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":16,"y":16}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":"ai.standard"}],"objectives":[{"type":"eliminate"}],"triggers":[],"reward":null},"scenarios/skirmish-hallowvale-small-1.json":{"id":"scenario.skirmish-hallowvale-small-1","type":"scenario","schemaVersion":1,"name":"Skirmish: Drownwatch Causeway","campaign":null,"map":"map.hallowvale-small-1","briefing":"The fen between the two watchtowers has drowned everything that ever tried to hold it. A single black river splits the board corner to corner and there are exactly two plank bridges on it, one in the north-west and one in the south-east. Your causeway leaves your portal along the southern rim and carries you to the far crossing; Zamorak's does the same on the other side. Everything between is bog - three tiles of effort for every one of ground, and the villages sunk in the middle of it are worth the wading. Only your barbarians can ford the river itself.","objectiveText":"Take every enemy portal and destroy every enemy unit. A commander with no portal and no units left is out; the last commander standing wins. If the turn limit runs out first, the most victory points wins.","players":[{"slot":0,"faction":"faction.saradomin","control":"human","gods":["faction.saradomin"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":2,"y":17}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":null},{"slot":1,"faction":"faction.zamorak","control":"ai","gods":["faction.zamorak"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":17,"y":2}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":"ai.standard"}],"objectives":[{"type":"eliminate"}],"triggers":[],"reward":null},"scenarios/skirmish-kharidian-small-1.json":{"id":"scenario.skirmish-kharidian-small-1","type":"scenario","schemaVersion":1,"name":"Skirmish: The Shantay Wadi","campaign":null,"map":"map.kharidian-small-1","briefing":"A terracotta ridge cuts the desert corner to corner and there is no walking over it. Two caravan passes are the only gates, one held by a village at each end, and where the ridge dips into the oasis the water has worn two notches shallow enough to wade - but only for a skirmisher. Between your camp and the front lies a dry wadi with a single sandstone causeway across it. Zamorak's half of the desert is the mirror image of yours, gate for gate and well for well, so nothing here will be won by the ground.","objectiveText":"Take every enemy portal and destroy every enemy unit. A commander with no portal and no units left is out; the last commander standing wins. If the turn limit runs out first, the most victory points wins.","players":[{"slot":0,"faction":"faction.saradomin","control":"human","gods":["faction.saradomin"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":1,"y":2}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":null},{"slot":1,"faction":"faction.zamorak","control":"ai","gods":["faction.zamorak"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":18,"y":17}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":"ai.standard"}],"objectives":[{"type":"eliminate"}],"triggers":[],"reward":null},"scenarios/skirmish-misthalin-medium-1.json":{"id":"scenario.skirmish-misthalin-medium-1","type":"scenario","schemaVersion":1,"name":"Skirmish: The Four Fords","campaign":null,"map":"map.misthalin-medium-1","briefing":"A duel across the diagonal of a four-player board. You hold the north-west camp, Zamorak the south-east; the two unused camps and everything in them start neutral, so the north-east and south-west quarters are open ground worth taking. Four rivers spiral out of the centre, each crossed by a single ford under a neutral tower, and the four villages of the central hamlet are the only structures either of you can reach without using someone's ford.","objectiveText":"Take every enemy portal and destroy every enemy unit. A commander with no portal and no units left is out; the last commander standing wins. If the turn limit runs out first, the most victory points wins.","players":[{"slot":0,"faction":"faction.saradomin","control":"human","gods":["faction.saradomin"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":5,"y":5}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":null},{"slot":1,"faction":"faction.zamorak","control":"ai","gods":["faction.zamorak"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":24,"y":24}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":"ai.standard"}],"objectives":[{"type":"eliminate"}],"triggers":[],"reward":null},"scenarios/skirmish-misthalin-medium-1-4p.json":{"id":"scenario.skirmish-misthalin-medium-1-4p","type":"scenario","schemaVersion":1,"name":"Skirmish: The Four Fords (4 players)","campaign":null,"map":"map.misthalin-medium-1","briefing":"Four commanders, one to a camp, on a board built so that no camp has an advantage over any other: the layout is 90-degree rotationally symmetric, so every start is the same distance from its own ford-tower and from the central hamlet. Saradomin holds both the north-west and, under a second banner, the south-west; Zamorak the south-east; Guthix the north-east. Turn order compensation applies - you move first and score last.","objectiveText":"Take every enemy portal and destroy every enemy unit. A commander with no portal and no units left is out; the last commander standing wins. If the turn limit runs out first, the most victory points wins.","players":[{"slot":0,"faction":"faction.saradomin","control":"human","gods":["faction.saradomin"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":5,"y":5}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":null},{"slot":1,"faction":"faction.zamorak","control":"ai","gods":["faction.zamorak"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":24,"y":24}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":"ai.standard"},{"slot":2,"faction":"faction.guthix","control":"ai","gods":["faction.guthix"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":24,"y":5}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":"ai.standard"},{"slot":3,"faction":"faction.saradomin","control":"ai","gods":["faction.saradomin"],"startingUnits":[{"unit":"unit.barbarian-chieftain","x":5,"y":24}],"spawnPool":null,"manaIncomeMultiplier":1,"startingMana":0,"ai":"ai.standard","color":"#8C4CD8","name
