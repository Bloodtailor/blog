<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Standard tier vs. gauntlet outcome</title>
  <desc id="desc">Three small-multiple bar charts comparing the three standard tiers used in the Armies of Gielinor gauntlet. Mean rounds to exit: tier 1 = 1.61, tier 2 = 1.00, tier 3 = 1.33. Escaped defects per judged item: tier 1 = 1.64, tier 2 = 2.00, tier 3 = 1.33. Share of items that stalled on the diminishing-returns stop rule: tier 1 = 29 percent, tier 2 = 0 percent, tier 3 = 0 percent. Tier 1 covers 28 items, tier 2 covers 2 items, tier 3 covers 6 items.</desc>
  <style>
    .viz {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --surface: #fcfcfb;
      --ring:    rgba(11,11,11,0.10);
      --ink:     #0b0b0b;
      --ink2:    #52514e;
      --rule:    #c3c2b7;
      --accent:  #2a78d6;
      --zero:    #a8a7a1;
    }
    @media (prefers-color-scheme: dark) {
      .viz {
        --surface: #1a1a19;
        --ring:    rgba(255,255,255,0.12);
        --ink:     #ffffff;
        --ink2:    #c3c2b7;
        --rule:    #383835;
        --accent:  #3987e5;
        --zero:    #6b6a66;
      }
    }
    .surface { fill: var(--surface); stroke: var(--ring); stroke-width: 1; }
    .h1   { fill: var(--ink);  font-size: 16px; font-weight: 600; }
    .h2   { fill: var(--ink2); font-size: 12px; }
    .pt   { fill: var(--ink);  font-size: 13px; font-weight: 600; }
    .ps   { fill: var(--ink2); font-size: 12px; }
    .val  { fill: var(--ink);  font-size: 13px; font-weight: 600; text-anchor: middle; }
    .cat  { fill: var(--ink2); font-size: 12px; text-anchor: middle; }
    .n    { fill: var(--ink2); font-size: 12px; text-anchor: middle; font-variant-numeric: tabular-nums; }
    .foot { fill: var(--ink2); font-size: 12px; }
    .bar  { fill: var(--accent); }
    .stub { fill: var(--zero); }
    .base { stroke: var(--rule); stroke-width: 1; }
  </style>

  <g class="viz">
    <rect class="surface" x="0.5" y="0.5" width="779" height="399" rx="10"/>

    <text class="h1" x="28" y="36">Standard tier vs. gauntlet outcome</text>
    <text class="h2" x="28" y="57">Armies of Gielinor, Session 2 — 36 judged items, 58 escaped defects</text>

    <!-- ============ Panel 1: mean rounds ============ -->
    <text class="pt" x="28" y="94">Mean rounds to exit</text>
    <text class="ps" x="28" y="112">judging rounds per item</text>
    <line class="base" x1="34" y1="304.5" x2="244" y2="304.5"/>

    <path class="bar" d="M51,304 L51,169.5 Q51,165.5 55,165.5 L81,165.5 Q85,165.5 85,169.5 L85,304 Z"/>
    <path class="bar" d="M122,304 L122,222 Q122,218 126,218 L152,218 Q156,218 156,222 L156,304 Z"/>
    <path class="bar" d="M193,304 L193,193.6 Q193,189.6 197,189.6 L223,189.6 Q227,189.6 227,193.6 L227,304 Z"/>

    <text class="val" x="68"  y="157">1.61</text>
    <text class="val" x="139" y="210">1.00</text>
    <text class="val" x="210" y="182">1.33</text>

    <text class="cat" x="68"  y="326">Tier 1</text>
    <text class="cat" x="139" y="326">Tier 2</text>
    <text class="cat" x="210" y="326">Tier 3</text>
    <text class="n"   x="68"  y="344">n = 28</text>
    <text class="n"   x="139" y="344">n = 2</text>
    <text class="n"   x="210" y="344">n = 6</text>

    <!-- ============ Panel 2: escaped defects per item ============ -->
    <text class="pt" x="279" y="94">Escaped defects per item</text>
    <text class="ps" x="279" y="112">DEFECT_LOG rows ÷ items</text>
    <line class="base" x1="285" y1="304.5" x2="495" y2="304.5"/>

    <path class="bar" d="M302,304 L302,167 Q302,163 306,163 L332,163 Q336,163 336,167 L336,304 Z"/>
    <path class="bar" d="M373,304 L373,136 Q373,132 377,132 L403,132 Q407,132 407,136 L407,304 Z"/>
    <path class="bar" d="M444,304 L444,193.6 Q444,189.6 448,189.6 L474,189.6 Q478,189.6 478,193.6 L478,304 Z"/>

    <text class="val" x="319" y="155">1.64</text>
    <text class="val" x="390" y="124">2.00</text>
    <text class="val" x="461" y="182">1.33</text>

    <text class="cat" x="319" y="326">Tier 1</text>
    <text class="cat" x="390" y="326">Tier 2</text>
    <text class="cat" x="461" y="326">Tier 3</text>
    <text class="n"   x="319" y="344">n = 28</text>
    <text class="n"   x="390" y="344">n = 2</text>
    <text class="n"   x="461" y="344">n = 6</text>

    <!-- ============ Panel 3: stall rate ============ -->
    <text class="pt" x="530" y="94">Items that stalled</text>
    <text class="ps" x="530" y="112">share exiting “diminishing”</text>
    <line class="base" x1="536" y1="304.5" x2="746" y2="304.5"/>

    <path class="bar" d="M553,304 L553,183.3 Q553,179.3 557,179.3 L583,179.3 Q587,179.3 587,183.3 L587,304 Z"/>
    <rect class="stub" x="624" y="301" width="34" height="3" rx="1.5"/>
    <rect class="stub" x="695" y="301" width="34" height="3" rx="1.5"/>

    <text class="val" x="570" y="171">29%</text>
    <text class="val" x="641" y="293">0%</text>
    <text class="val" x="712" y="293">0%</text>

    <text class="cat" x="570" y="326">Tier 1</text>
    <text class="cat" x="641" y="326">Tier 2</text>
    <text class="cat" x="712" y="326">Tier 3</text>
    <text class="n"   x="570" y="344">n = 28</text>
    <text class="n"   x="641" y="344">n = 2</text>
    <text class="n"   x="712" y="344">n = 6</text>

    <!-- ============ key ============ -->
    <text class="foot" x="28" y="376">Tier 1 = real screenshot reference&#160;&#160;·&#160;&#160;Tier 2 = named comparable from memory&#160;&#160;·&#160;&#160;Tier 3 = written rubric only</text>
  </g>
</svg>
